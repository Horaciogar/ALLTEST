<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLTEST - Mi Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="index.html">ALLTEST</a>
        <div class="ms-auto">
            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Refacciones</a></li>
                <li class="nav-item"><a class="nav-link" href="citas.html">Agendar Cita</a></li>
                <li class="nav-item"><a class="nav-link active" href="perfil.html">Mi Cuenta</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <h2 class="mb-4">Mi Cuenta y Perfil</h2>

        <div class="row">
            <!-- Menú Lateral -->
            <div class="col-md-3 mb-3">
                <aside class="card p-3 bg-light shadow-sm">
                    <h5 class="fw-bold mb-3">Panel de Usuario</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-dark text-start btn-sm">Información Personal</button>
                        <button class="btn btn-outline-dark text-start btn-sm">Mis Citas Agendadas</button>
                        <button class="btn btn-outline-dark text-start btn-sm">Historial de Compras</button>
                        <button class="btn btn-outline-danger text-start btn-sm">Cerrar Sesión</button>
                    </div>
                </aside>
            </div>

            <!-- Formulario de Edición -->
            <div class="col-md-9">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-3">Editar Información del Propietario</h4>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre:</label>
                            <input type="text" class="form-control" value="Carlos Pérez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico:</label>
                            <input type="email" class="form-control" value="carlos.perez@email.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Vehículo Registrado:</label>
                            <input type="text" class="form-control" value="Nissan Versa 2022">
                        </div>
                        <button type="submit" class="btn btn-dark">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container small">© 2026 ALLTEST - Todos los derechos reservados</div>
    </footer>
</body>
</html>
