<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLTEST - Catálogo de Refacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="index.html">ALLTEST</a>
        <div class="ms-auto">
            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="catalogo.html">Refacciones</a></li>
                <li class="nav-item"><a class="nav-link" href="citas.html">Agendar Cita</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Mi Cuenta</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <h2 class="mb-3">Catálogo de Refacciones</h2>

        <!-- Barra de búsqueda -->
        <div class="mb-4">
            <input type="text" class="form-control form-control-lg" placeholder="🔍 Buscar por nombre de refacción, modelo o categoría...">
        </div>

        <!-- Resultados / Tarjetas de productos con imágenes reales -->
        <div class="row g-3 mb-5">
            <div class="col-md-4">
                <div class="card p-2 h-100 text-center">
                    <img src="https://images.unsplash.com/photo-1543465077-db45d34b88a5?auto=format&fit=crop&w=500&q=80" class="card-img-top object-fit-cover rounded" style="height: 160px;" alt="Filtro">
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold">Filtro de Aceite Sintético</h5>
                        <p class="text-success fw-bold">$250.00 MXN</p>
                        <button class="btn btn-dark btn-sm mt-auto">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-2 h-100 text-center">
                    <img src="https://images.unsplash.com/photo-1489824904134-891ab64532f1?auto=format&fit=crop&w=500&q=80" class="card-img-top object-fit-cover rounded" style="height: 160px;" alt="Balatas">
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold">Juego de Balatas Delanteras</h5>
                        <p class="text-success fw-bold">$850.00 MXN</p>
                        <button class="btn btn-dark btn-sm mt-auto">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-2 h-100 text-center">
                    <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=500&q=80" class="card-img-top object-fit-cover rounded" style="height: 160px;" alt="Amortiguadores">
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold">Amortiguadores Traseros</h5>
                        <p class="text-success fw-bold">$1,450.00 MXN</p>
                        <button class="btn btn-dark btn-sm mt-auto">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container small">© 2026 ALLTEST - Todos los derechos reservados</div>
    </footer>
</body>
</html>
